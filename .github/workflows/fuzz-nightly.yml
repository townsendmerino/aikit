name: fuzz-nightly

# The longer active-fuzz pass (roadmap §3.1/§3.4). The per-PR ci.yml runs a 20s
# smoke per target to catch obvious regressions fast; this runs each target for
# minutes on a schedule to reach the deeper inputs a smoke can't, and uploads any
# discovered crasher so it can be replayed and turned into a regression seed.
on:
  schedule:
    - cron: "0 7 * * *" # daily, 07:00 UTC
  workflow_dispatch: # and on demand

permissions:
  contents: read

jobs:
  fuzz:
    name: long fuzz
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: embed, fn: FuzzParseGGUF }
          - { pkg: embed, fn: FuzzParseSafetensors }
          - { pkg: embed, fn: FuzzParseShardIndex }
          - { pkg: embed, fn: FuzzGGUFDequant }
          - { pkg: bm25, fn: FuzzTokenize }
          - { pkg: chunk, fn: FuzzLineChunker }
          - { pkg: chunk/markdown, fn: FuzzMarkdownChunk }
          - { pkg: chunk/regex, fn: FuzzRegexChunk }
          - { pkg: ann, fn: FuzzLoadHNSW }
          - { pkg: ann, fn: FuzzLoadFlatI8 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # Retry ONCE, but only when no reproducer was written. `go test -fuzz` with a
      # duration deadline can report "context deadline exceeded" with no crasher when the
      # coordinator cannot wind its workers down within the grace on a slow/loaded runner
      # — a shutdown-timing flake, not a bug (steady exec/sec right up to the deadline,
      # empty testdata/fuzz). A REAL find persists a reproducer under
      # testdata/fuzz/<Target>/ that replays deterministically, so if one exists we fail
      # immediately: never retry a real crasher away, and let the upload step capture it.
      - name: fuzz ${{ matrix.pkg }} ${{ matrix.fn }}
        shell: bash
        run: |
          crashdir="${{ matrix.pkg }}/testdata/fuzz/${{ matrix.fn }}"
          for attempt in 1 2; do
            echo "::group::fuzz attempt ${attempt}: ${{ matrix.pkg }} ${{ matrix.fn }}"
            if go test "./${{ matrix.pkg }}/" -run '^$' -fuzz "^${{ matrix.fn }}\$" -fuzztime=5m; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if compgen -G "${crashdir}/*" >/dev/null 2>&1; then
              echo "reproducer written under ${crashdir} — real failure, not retrying"
              exit 1
            fi
            echo "no reproducer written (shutdown/deadline flake) — retry ${attempt}/2"
          done
          echo "fuzz flaked with no reproducer on both attempts"
          exit 1

      # A crash drops a reproducer under testdata/fuzz/<Target>/; keep it so the
      # failure can be replayed locally and promoted to a committed seed.
      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crash-${{ matrix.fn }}
          path: "**/testdata/fuzz/${{ matrix.fn }}/**"
          if-no-files-found: ignore
