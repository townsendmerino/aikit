name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: root module (pure-Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # golangci-lint with the conservative config at .golangci.yml: errcheck
      # + govet + ineffassign + staticcheck + unused (no QF* stylistic
      # quickfix rules, no ST1003 — aikit's underscore names mirror the GGML
      # and HF-checkpoint spellings on purpose; see the config). Pinned to the
      # same action major + version ken uses so the two repos report
      # identically for the packages that moved between them (ADR-034).
      #
      # install-mode: goinstall — NOT the default binary download. On 2026-08-12 this
      # step failed twice in one hour fetching the release tarball from GitHub's CDN
      # (a 503, then a socket hang up), each time after the action's own retries, and
      # each failure cost a full re-run and looked like a code problem. goinstall
      # sources the same pinned version through the Go module proxy, which setup-go
      # already caches, so a CDN blip cannot redden a build.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          install-mode: goinstall

      # Core-cleanliness guard (migration-plan §7/§9): the root module must
      # stay pure-Go — no cgo WebGPU, no tree-sitter. Those live in the
      # goinfer/gpu and aikit/chunk/treesitter modules respectively.
      - name: no cgo deps in core graph
        run: |
          leak="$(go list -deps ./... | grep -Ei 'webgpu|gotreesitter' || true)"
          if [ -n "$leak" ]; then
            echo "core module pulled a quarantined dep:"; echo "$leak"; exit 1
          fi

      # CGO_ENABLED=0 must build — proves the core is genuinely cgo-free.
      - name: build with cgo disabled
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      # Model-dependent tests skip cleanly when assets are absent (as on CI) — so the run is
      # routed through tools/skipcensus (AK3), which runs `go test -json -race ./...`, re-emits
      # the normal log, and prints the skip tally BY REASON under the verdict. The exit code is
      # go test's own; this reports a denominator, it does not gate. A green that says
      # "N passed, M skipped (145 missing asset, …)" is honest; a bare `ok` over M hidden skips
      # is what this replaces.
      - name: test (race)
        run: go run -C tools ./skipcensus -race ./...

      # Exercise the debug-only quant-kernel contract checks (§3.2): build the
      # checks_on.go path and confirm the real kernels honor their own shape
      # contracts (and that the asserts compile + fire). No-ops in normal builds.
      - name: test (aikit_checks)
        run: go test -tags aikit_checks ./linalg/

  fuzz-smoke:
    name: fuzz (smoke)
    # Its own job, not a trailing step of `core`: ten 15s targets run serially cost ~3 min,
    # and as the last step of `core` they sat on CI's critical path behind the race tests.
    # Nothing here depends on those steps, so running alongside them keeps the same checks
    # and takes ~3 min off the wall clock.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Short fuzz smoke on the untrusted-input surfaces: the binary parsers
      # (GGUF / safetensors, §3.1) and the indexing-pipeline text paths (bm25
      # tokenizers + chunkers, §3.4) — a panic in either takes down an index
      # build. The committed seed + regression corpus runs under the race step
      # above on every push; this adds a brief active-fuzz pass to catch new
      # inputs. A longer nightly run is a follow-up.
      #
      # Retry ONCE per target, but ONLY when no reproducer was written — the same
      # hardening b923814 gave fuzz-nightly.yml after FuzzMarkdownChunk flaked with
      # "context deadline exceeded" and no crasher (steady exec/sec to the deadline,
      # empty testdata/fuzz, clean locally — a coordinator shutdown-timing flake, not
      # a bug). This push-triggered smoke step never got the same fix and hit the
      # identical signature on 2026-08-14 (FuzzParseGGUF, unrelated docs-only push).
      # A real find persists a reproducer under testdata/fuzz/<Target>/ that replays
      # deterministically, so that case still fails immediately — never retrying a
      # real crasher away.
      - name: fuzz (smoke)
        run: |
          set -e
          fuzz() {
            pkg="$1"; fn="$2"
            crashdir="${pkg}/testdata/fuzz/${fn}"
            for attempt in 1 2; do
              if go test "./${pkg}/" -run xxx -fuzz="^${fn}\$" -fuzztime=15s; then
                return 0
              fi
              if compgen -G "${crashdir}/*" >/dev/null 2>&1; then
                echo "reproducer written under ${crashdir} — real failure, not retrying"
                return 1
              fi
              echo "no reproducer written (shutdown/deadline flake) — retry ${attempt}/2"
            done
            echo "fuzz flaked with no reproducer on both attempts"
            return 1
          }
          for fn in FuzzParseGGUF FuzzParseSafetensors FuzzParseShardIndex FuzzGGUFDequant; do
            fuzz embed "$fn"
          done
          fuzz bm25 FuzzTokenize
          fuzz chunk FuzzLineChunker
          fuzz chunk/markdown FuzzMarkdownChunk
          fuzz chunk/regex FuzzRegexChunk
          fuzz ann FuzzLoadHNSW
          fuzz ann FuzzLoadFlatI8

  # arm64 is the primary deployment arch (every tuning note references an M1
  # Pro), yet the core job above runs amd64-only — so the NEON f32/i8/SDOT/W4A8
  # asm, the Dot2x8 pair path, packedFill, detectDotProd, AND the exact-equality
  # M-invariance / width-invariance / packed-path bit-identity gates are all
  # dead in every amd64 CI run. This job executes them on a native arm64 runner
  # (GitHub-hosted, GA for public repos), so an arm64-only regression — an asm
  # edit, a reduction-order change — is caught at PR time, not in production.
  arm64:
    name: root module (arm64 — NEON asm + bit-identity gates)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # The bit-identity + parity gates run their arm64 (NEON) legs here.
      - name: test (race)
        run: go test -race ./...
      # The debug-only quant-kernel contract checks on the arm64 kernels.
      - name: test (aikit_checks)
        run: go test -tags aikit_checks ./linalg/

  simd:
    name: GOEXPERIMENT=simd (${{ matrix.os }})
    # Experimental-tier coverage for the Go 1.27 simd package (item 13: SoftmaxRowInto's
    # exp/max-scan/scale passes, exp_simd.go). The default (non-experimental) build is
    # byte-for-byte unaffected by this code existing — SoftmaxRowInto's non-SIMD behavior
    # is unchanged, gated by every other job in this file — so this is the ONLY place the
    # GOEXPERIMENT=simd path gets exercised at all. Two runners because NEON (arm64) and
    # AVX2 (amd64) are genuinely different code paths under the portable simd API. Real
    # hardware AND forced emulation (GODEBUG=simd=0, runs on any box regardless of ISA) —
    # both are correctness legs; this job asserts nothing about timing (perfgate's job).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build
        run: GOEXPERIMENT=simd go build ./linalg/...
      - name: vet
        run: GOEXPERIMENT=simd go vet ./linalg/...
      # No -skip here any more. The measurement harnesses that used to need one (starting
      # with TestFMAIssueProbe) now gate themselves on AIKIT_HARNESS — see
      # linalg/harness_gate_test.go. A regex here only ever protected THIS job, had to be
      # remembered for each new harness, and was invisible to tools/skips; the source gate
      # covers every job that runs the package and lands in the census as "env opt-in".
      - name: test (hardware)
        run: GOEXPERIMENT=simd go test ./linalg/... ./encoder/... ./vision/...
      - name: test (forced emulation)
        run: GOEXPERIMENT=simd GODEBUG=simd=0 go test ./linalg/...
      - name: execute softmax benchmark (no timing assertion)
        run: GOEXPERIMENT=simd go test ./linalg/ -run '^$' -bench '^BenchmarkSoftmaxRow_vs_scalar$' -benchtime=1x

  treesitter:
    name: chunk/treesitter submodule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Separate module; resolves the published aikit from the proxy. cgo is
      # expected here (gotreesitter) — that's why it's quarantined.
      - name: build + test
        working-directory: chunk/treesitter
        run: |
          go build ./...
          go vet ./...
          go test ./...

  vulncheck:
    name: govulncheck (all 14 modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Reachability-filtered, so a finding means a symbol THIS build reaches is
      # affected — not merely that a vulnerable version is somewhere in the graph.
      # Fails on "could not scan" as loudly as on "vulnerable": six of the modules were
      # unscannable until 2026-08-11 (stale go.mod, or darwin-only sources matching zero
      # packages on Linux), and a clean report that silently covers half a repo implies
      # the other half.
      - name: scan
        run: go run -C tools ./vulncheck

  perf-smoke:
    name: perf benchmarks (execute, no timing assertion)
    # AK2: the regime-spanning perf benchmarks (BenchmarkW8A8SpanShapes,
    # BenchmarkGEMV_W8A8_baseline) never ran in CI — `go test` without -bench skips them, so a
    # benchmark that panics or OOMs was invisible until run by hand. This EXECUTES them once
    # (-benchtime=1x) and asserts NOTHING about timing: a shared runner cannot measure the 3%
    # class. The A/B verdict is tools/perfgate, run on a real box in the release ritual, where
    # the machine-derived noise floor is tight enough to mean something.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: execute perf benchmarks
        run: go test ./linalg/ -run '^$' -bench '^(BenchmarkW8A8SpanShapes|BenchmarkGEMV_W8A8_baseline)$' -benchtime=1x

  scripts-boundary:
    name: scripts boundary (no deciding-shell / no Python residue)
    # Both campaigns' claims, enforced by derivable rules: every .py under scripts/ is a declared
    # external-reference generator (scripts/oracle/) or fixture (scripts/fixtures/), and NO .sh
    # lives under scripts/ (deciding-shell gates are Go commands under tools/). A stray of either
    # fails. Derived by directory, so nothing is hand-enumerated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: scriptsguard
        run: go run -C tools ./scriptsguard

  gpu-pins:
    name: gpu backend version pins
    # AK1: the eight gpu/* backend modules each `require` the root and gpu series by an exact
    # version — static go.mod text MVS reads, not derivable at build. This gate asserts each
    # names the LATEST vX.Y.Z and gpu/vX.Y.Z tag, so the drift that shipped once (root at
    # v1.17.1, backends still pinning v1.17.0) goes red on push, not on a consumer's build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gpupins reads `git tag`; a shallow checkout has none
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gpu backend pins
        run: go run -C tools ./gpupins

  gpu-kernels:
    name: gpu mechanical gate (${{ matrix.os }})
    # The mechanical half of the gpu pre-tag ritual, run in CI on BOTH OSes so CI and the
    # ritual run the IDENTICAL gate (tools/gpugate) — one check set, nothing to drift. The
    # union covers all nine gpu modules: the four *metal build and lint only on darwin, the
    # four *cuda only on Linux. golangci-lint across the nine modules is now actually RUN
    # here (it was installed-but-never-invoked before — a check that could not fail); the
    # gate pins its BUILD via `go run @v2.13.0`, so its bundled staticcheck matches every box.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod # pin the Go that builds golangci-lint → deterministic staticcheck
      # NVRTC (Linux only) lets the gate's ptx-repro group rebuild PTX and compare bytes.
      # Pinned to the version the committed artifacts record (V12.9.86); on macOS the group is
      # n/a (NVIDIA ships no NVRTC for Apple Silicon) and this step is skipped. These are
      # NAMESPACE packages, so __file__ is None and __path__ is the thing to read.
      - name: install pinned NVRTC 12.9.86
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --quiet \
            nvidia-cuda-nvrtc-cu12==12.9.86 nvidia-cuda-runtime-cu12==12.9.79
          lib="$(python3 -c 'import nvidia.cuda_nvrtc as m; print(m.__path__[0])')/lib"
          inc="$(python3 -c 'import nvidia.cuda_runtime as m; print(m.__path__[0])')/include"
          test -e "$lib/libnvrtc.so.12" || { echo "no libnvrtc.so.12 under $lib"; ls -la "$lib" || true; exit 1; }
          test -e "$inc/cuda_fp16.h"    || { echo "no cuda_fp16.h under $inc";    ls -la "$inc" || true; exit 1; }
          echo "NVRTC_LIB=$lib" >> "$GITHUB_ENV"
          echo "CUDA_INC=$inc" >> "$GITHUB_ENV"
      - name: gpu mechanical gate
        run: go run -C tools ./gpugate

  windows:
    name: windows (pure-Go core)
    # Pinned: GitHub redirects `windows-latest` to windows-2025 by 2026-06-15;
    # pin explicitly so the runner image doesn't shift under us unannounced.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The core has no cgo, so it builds + tests on Windows with no toolchain.
      # The mmap loaders fall back to a heap read here (embed/mmap_other.go).
      # No -race: the Windows race detector needs a cgo C toolchain.
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
