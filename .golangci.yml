# golangci-lint config for aikit.
#
# Mirrors ken's posture (the repo aikit's ann/bm25/chunk packages moved
# here from, ADR-034) so a contributor moving between the two repos gets
# the same lint feedback: enable the linters that catch real bugs
# (errcheck, govet, ineffassign, staticcheck, unused) and disable the
# cosmetic-only quickfix rules — ken drops QF1001/QF1003 (De Morgan's law,
# tagged-switch); aikit also drops QF1002 for the same reason.
#
# aikit-specific vs ken's copy: no database/sql or MCP-session errcheck
# exclusions (aikit is a library with neither), plus the ST1003 note below.

version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    staticcheck:
      checks:
        - "all"
        # QF* are quickfix-only stylistic suggestions, not bug detectors:
        #   - QF1001 "could apply De Morgan's law"
        #   - QF1002 "could use tagged switch"
        #   - QF1003 "could use tagged switch on <expr>"
        - "-QF1001"
        - "-QF1002"
        - "-QF1003"
        # ST1003 flags underscores in Go names. aikit's underscore names are
        # deliberate spec-mirroring, and renaming them would break the
        # traceability that makes them reviewable against the upstream spec:
        #   - embed/gguf.go's ggmlTypeQ2_K…Q6_K mirror the GGML quantization
        #     type names exactly as ggml/llama.cpp spell them (Q4_K_M etc.).
        #   - encoder's EmbLN_W / EmbLN_B mirror the HF checkpoint tensor
        #     names they load, so a shape bug is greppable against the dump.
        - "-ST1003"

    errcheck:
      # check-blank: catch `_ = f()` blank discards of an error, not just an
      # unassigned error return (AK4). aikit has zero such discards on any
      # production launch/copy/sync/download path today (govulncheck's sibling
      # goinfer had 35 on its decode forward path); enabling this is what keeps
      # that true — a new `_ = q.Launch(...)` or `_ = gpu.Download(...)` on a
      # production path reddens the lint. The currently-acceptable sites are
      # declared below (exclude-functions) or scoped out for tests.
      check-blank: true
      # Don't flag these patterns — they're idiomatic-Go-by-design.
      exclude-functions:
        # Idiomatic deferred-Close on read-side resources where the close
        # error genuinely doesn't matter (we're not writing, so there's no
        # pending data to flush). aikit's loaders open model artifacts
        # read-only (embed/gguf.go, embed/safetensors.go, embed/mmap_*.go).
        - (*os.File).Close
        - (io.Closer).Close
        # The mmap-backed readers' Close munmaps a read-only region; callers
        # that defer it are releasing, not flushing. Where the error IS
        # load-bearing (double-close semantics) it's asserted explicitly —
        # see encoder/mmap_test.go.
        - (*github.com/townsendmerino/aikit/embed.SafetensorsFile).Close
        - (*github.com/townsendmerino/aikit/embed.GGUFFile).Close
        - (*github.com/townsendmerino/aikit/ann.FlatI8).Close
        # mmap.Unmap is the same release-don't-flush shape as the Closes
        # above, just spelled as a free function on the mmap leaf.
        - github.com/townsendmerino/aikit/mmap.Unmap
        # Logging writers — the writer's Write error is uninteresting for a
        # log line.
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint

  exclusions:
    rules:
      # check-blank IS enforced in tests, but only where a swallowed error turns into a
      # SILENT ZERO instead of a loud failure — the GPU launch / copy / synchronise / download
      # and device-forward calls (q.Launch, q.Sync, gpuMatmul, a gpu backend's Encode/Forward,
      # Download/Upload/Synchronize). goinfer's A13 was exactly that shape — four blank discards
      # of a device call in a test — and it cost most of a day of investigation. Those are NOT
      # excluded below, so `_ = q.Launch(...)` in a test reddens the lint.
      #
      # Everything else in a test is the test's own concern: its assertions are the check, and
      # `_ = f.MarshalBinary()` / `_ = m.Encode(x)` (CPU) / `_ = filepath.WalkDir(...)` are
      # called for effect, timing, or setup. Those benign families are declared here by
      # message, so the noise stays out while the load-bearing device calls stay checked.
      - path: _test\.go # teardown Close — nothing to flush
        linters: [errcheck]
        text: "Error return value of `.*\\.Close` is not checked"
      - path: _test\.go # corpus/round-trip serialization into an in-memory buffer
        linters: [errcheck]
        text: "Error return value of `(.*\\.MarshalBinary|.*\\.WriteTo|binary\\.Write|json\\.Marshal)` is not checked"
      - path: _test\.go # filesystem walk / temp-dir setup+cleanup / test munmap
        linters: [errcheck]
        text: "Error return value of `(filepath\\.(WalkDir|Glob|Rel)|os\\.(MkdirAll|Remove|RemoveAll)|syscall\\.Munmap)` is not checked"
      - path: _test\.go # image encode into a buffer / discard sink
        linters: [errcheck]
        text: "Error return value of `((png|jpeg)\\.Encode|io\\.Discard\\.Write)` is not checked"
      - path: _test\.go # safetensors/tensor accessors probed in accessor tests
        linters: [errcheck]
        text: "Error return value of `.*\\.(Float16sToF32|Float32s|SubF32|Tensor)` is not checked"
      - path: _test\.go # chunk helper called for effect
        linters: [errcheck]
        text: "Error return value of `chunk\\.ChunkFile` is not checked"
      # CPU encoder/tokenizer forward called for effect/timing — scoped to the root encoder and
      # embed tests, so a GPU backend's Encode/Forward (gpu/*_test.go) is NOT covered and still
      # reddens the lint.
      - path: (embed|encoder)/.*_test\.go
        linters: [errcheck]
        text: "Error return value of `.*\\.(Encode|EncodeBatch|EncodeWithSpecials)` is not checked"
      # Unnamed returns errcheck could not attribute (method values, multi-assign) in root-module
      # tests — benign discards in parse/mmap/registry tests. The GPU device calls this rule set
      # keeps checked are all NAMED (q.Launch, gpuMatmul, …), so they are not matched here.
      - path: _test\.go
        linters: [errcheck]
        text: "^Error return value is not checked$"
      # vision CPU forward in a scratch/fuzz benchmark (vision.Encoder is CPU; the GPU vision
      # forward lives in gpu/visionmetal + gpu/visioncuda and is not covered here).
      - path: vision/.*_test\.go
        linters: [errcheck]
        text: "Error return value of `.*\\.Forward` is not checked"
      # gpu/cuda.go closes cuda handles (device buffers, modules, contexts) on the
      # release/error path — the same release-side posture as the reader Closes in
      # exclude-functions above, across several one-off cuda handle types too specific for
      # per-type entries. It is a linux-only file (//go:build linux), so it lints only on the
      # gpu gate's ubuntu leg, where check-blank (AK4) surfaced these explicit `_ = x.Close()`
      # discards. Scoped to this one production file, so a Close discard anywhere else still
      # fires.
      - path: gpu/cuda\.go
        linters: [errcheck]
        text: "Error return value of `.*\\.Close` is not checked"
      # gpu/visioncuda's encoder.Close destroys a captured CUDA graph exec handle on
      # teardown — same release-not-flush posture as gpu/cuda.go's own Graph.Close
      # discards above, and encoder.Close() (the vision.ResidentBackend interface method)
      # has no error return to propagate a failure to.
      - path: gpu/visioncuda/encoder\.go
        linters: [errcheck]
        text: "Error return value of `e\\.graph\\.Close` is not checked"

issues:
  # Show every finding so the cleanup pass can't miss any. Default is 50
  # (golangci-lint v2).
  max-issues-per-linter: 0
  max-same-issues: 0
